<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Newcastle IRM – Selection & Diagnostic Hub</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#f3f7f6;--card:#fff;--ink:#1b2227;--mut:#5c6b70;--line:#dbe5e3;--brand:#005e6a;--on:#fff;--head:#1f9d55;--teal:#0a9aa8;--green:#3faa24;--cyan:#02bbcc;--grad:linear-gradient(90deg,#3faa24,#02bbcc);--gold:#c47a12;--bad:#b3392f;--ok:#1f8a4c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#11191c;--card:#1a2528;--ink:#e6eef0;--mut:#9db0b5;--line:#2c3c40;--brand:#22b8c5;--on:#0b1416;--head:#4fcf86;--teal:#22b8c5;--gold:#f0b04e;--bad:#ef7b70;--ok:#5cc58a}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#11191c;--card:#1a2528;--ink:#e6eef0;--mut:#9db0b5;--line:#2c3c40;--brand:#22b8c5;--on:#0b1416;--head:#4fcf86;--teal:#22b8c5;--gold:#f0b04e;--bad:#ef7b70;--ok:#5cc58a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.55 Poppins,system-ui,sans-serif}
h1,h2,h3{font-family:Poppins,system-ui,sans-serif;font-weight:600;margin:.2em 0;line-height:1.3}
h2{color:var(--head);font-size:21px}h3{font-size:16px}
.top{background:#fff;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:8px 16px;border-bottom:1px solid #e3e9e8}
.top img{display:block;height:44px;width:auto}.top img.nbi{height:38px}
.hero{background:linear-gradient(135deg,#1b2227 0%,#2b3b41 60%,#24434a 100%);color:#fff;padding:16px 16px 12px}
.hero small{color:#5fd6e0;font-weight:500;letter-spacing:.02em}.hero h1{font-size:21px;color:#fff;margin:2px 0 4px}
.tabs{display:flex;gap:6px;overflow-x:auto;margin:10px -16px 0;padding:0 16px 4px;scrollbar-width:thin}
.tabs button{flex:none;background:rgba(255,255,255,.06);color:#d3dde0;border:1px solid rgba(255,255,255,.16);border-radius:999px;padding:7px 16px;font:500 13px Poppins,sans-serif;cursor:pointer;white-space:nowrap}
.tabs button.cur{background:var(--grad);border-color:transparent;color:#fff;font-weight:600}
.tabs button:not(.cur):hover{border-color:#5fd6e0}
main{max-width:1100px;margin:0 auto;padding:18px 16px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px;box-shadow:0 1px 3px rgba(16,40,44,.05)}
.k{font:600 28px Poppins,sans-serif;color:var(--brand)}.l{color:var(--mut);font-size:12.5px;font-weight:500}
.bar{height:10px;background:var(--line);border-radius:5px;overflow:hidden}.bar i{display:block;height:100%;background:var(--grad)}
.row{display:flex;align-items:center;gap:10px;margin:6px 0}.row span:first-child{width:130px;font-size:13px;flex:none}.row .bar{flex:1}.row b{width:42px;text-align:right;font:13px ui-monospace,monospace}
.wrap{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:14px}th,td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}th{color:var(--mut);font-size:12px;font-weight:600}
tr.c{cursor:pointer}tr.c:hover{background:rgba(2,187,204,.08)}
input,select,textarea,button{font:inherit;color:var(--ink)}
input,select,textarea{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 10px;max-width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--cyan);outline-offset:0;border-color:transparent}
input[type=checkbox]{accent-color:var(--brand)}
.btn{background:var(--grad);color:#fff;border:0;border-radius:999px;padding:9px 18px;cursor:pointer;font-weight:600;box-shadow:0 3px 10px rgba(2,187,204,.22)}.btn.s{background:none;color:var(--ink);border:1.5px solid var(--line);box-shadow:none}.btn.s:hover{border-color:var(--brand)}.btn.d{background:var(--bad);box-shadow:none}
.f{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}.f label{display:flex;flex-direction:column;font-size:12px;color:var(--mut);gap:3px}
.tag{display:inline-block;padding:1px 10px;border-radius:999px;font-size:12px;background:var(--line)}.ok{color:var(--ok)}.bad{color:var(--bad)}.warn{color:var(--gold)}
.q{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 10px}.q button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 12px;cursor:pointer;font-size:13px}.q button:hover{border-color:var(--brand)}.q button.on{background:var(--brand);color:var(--on);border-color:var(--brand)}
.hint{color:var(--mut);font-size:12px}.tb{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.msg{border-left:3px solid var(--green);padding:6px 10px;background:rgba(63,170,36,.08);border-radius:0 8px 8px 0}.msg:empty{display:none}

.sec{margin:26px 2px 10px}.sec h2{font-size:18px;color:var(--ink)}.sec .hint{margin:2px 0 0}
.g2{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}.g3{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}.g2>.card,.g3>.card{margin-bottom:0}
@media(max-width:420px){.g2,.g3{grid-template-columns:1fr}}
.kpis{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}.kp{margin-bottom:0;border-top:4px solid transparent;border-image:var(--grad) 1;border-image-slice:1 0 0 0}.kp .k{line-height:1.1}.kp .l{margin-top:4px;color:var(--ink)}
.hello{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;background:linear-gradient(120deg,color-mix(in srgb,var(--green) 10%,var(--card)),color-mix(in srgb,var(--cyan) 10%,var(--card)))}
.hbr{display:grid;grid-template-columns:minmax(100px,40%) 1fr auto;gap:2px 10px;align-items:center;margin:8px 0}.hbl{font-size:13px;line-height:1.3}.hbv{font:600 12px ui-monospace,monospace;min-width:44px;text-align:right}.hbn{grid-column:2/-1;font-size:11.5px;color:var(--mut)}
.dn{display:flex;gap:18px;align-items:center;flex-wrap:wrap}.lg div{font-size:13px;margin:5px 0}.sw{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:7px;vertical-align:middle}
.ht td,.ht th{padding:5px 6px}.hc{text-align:center}.hcv{display:inline-block;min-width:38px;padding:4px 6px;border-radius:6px;font:600 12px ui-monospace,monospace;background:var(--line)}
.hm{display:grid;grid-template-columns:minmax(96px,auto) repeat(9,1fr);gap:4px;align-items:center}.hmh{font-size:10.5px;color:var(--mut);text-align:center}.hml{font-size:13px;padding-right:8px}.hmc{height:28px;border-radius:6px;background:var(--line);display:flex;align-items:center;justify-content:center;font:700 12px ui-monospace,monospace}.hmc.cur{outline:2.5px solid var(--ink);outline-offset:1px}
.chips{display:flex;gap:6px;flex-wrap:wrap}.chip{display:inline-block;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:500;background:var(--line);color:var(--ink);white-space:nowrap}.chip.grn{background:color-mix(in srgb,var(--ok) 16%,var(--card));color:var(--ok)}.chip.amb{background:color-mix(in srgb,var(--gold) 18%,var(--card));color:var(--gold)}.chip.tl{background:color-mix(in srgb,var(--brand) 16%,var(--card));color:var(--brand)}.chip.mut{color:var(--mut)}
.ph{display:flex;gap:16px;align-items:center;flex-wrap:wrap;background:linear-gradient(135deg,#1b2227 0%,#2b3b41 60%,#24434a 100%);color:#fff;border:0}.ph h2{color:#fff;font-size:24px;margin:2px 0}.ph small{color:#5fd6e0;font-weight:500}.ph .chip{background:rgba(255,255,255,.12);color:#fff}.ph .chip.grn{background:rgba(63,170,36,.3)}.ph .chip.amb{background:rgba(240,176,78,.3)}.ph .chip.tl{background:rgba(2,187,204,.3)}
.ro{font-size:12.5px;color:var(--mut);margin:-4px 2px 10px;padding-left:10px;border-left:3px solid var(--cyan)}
.jump{display:flex;gap:6px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;position:sticky;top:0;z-index:3;background:var(--bg);padding:8px 0}.jump a{flex:none;font-size:13px;padding:5px 12px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink);text-decoration:none}.jump a:hover{border-color:var(--brand)}
.ck{font-size:13.5px;margin:6px 0;padding-left:2px}.ck.y{color:var(--ink)}.ck.y:first-letter{color:var(--ok)}.ck.n{color:var(--bad)}
.kv{display:grid;gap:12px 20px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}.kvi .hint{margin-bottom:2px}
.ncg{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}.nc{border:1px solid var(--line);border-left:4px solid var(--line);border-radius:10px;padding:12px}.nc.amb{border-left-color:var(--gold)}.nc.grn{border-left-color:var(--ok)}.nch{display:flex;justify-content:space-between;gap:8px;align-items:flex-start;margin-bottom:6px}.nca{font-size:13px;margin-top:8px}.nc ul{margin:6px 0 0;padding-left:18px;font-size:13px}
.big{font:600 30px Poppins,sans-serif;color:var(--brand);margin:2px 0 6px}.big span{font-size:13px;font-weight:500;color:var(--mut)}
details{border-top:1px solid var(--line);padding:10px 0}details:first-child{border-top:0}summary{cursor:pointer;font-weight:600}.ans{padding-left:22px;margin:10px 0 0}.ans li{display:flex;justify-content:space-between;gap:12px;padding:5px 0;border-bottom:1px solid var(--line);font-size:13px}.ans li b{white-space:nowrap;font-weight:500;color:var(--mut)}.ans li b.ok{color:var(--ok)}
.gal{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}.gc{text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;cursor:pointer;display:flex;flex-direction:column;gap:10px;box-shadow:0 1px 3px rgba(16,40,44,.05);transition:border-color .15s,transform .15s}.gc:hover{border-color:var(--brand);transform:translateY(-1px)}.gch{display:flex;justify-content:space-between;gap:10px}.gs{font:700 22px Poppins,sans-serif;color:var(--brand);white-space:nowrap}.gs span{font-size:11px;color:var(--mut);font-weight:500}.gcb{display:flex;gap:10px;align-items:center}.gc .chip{white-space:normal}.gc .chips{min-width:0}.gcl{font-size:12.5px;color:var(--brand);font-weight:600}
.tl{margin-top:6px}.tli{display:flex;gap:12px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line)}.tli:last-child{border-bottom:0}.tli .dot{width:10px;height:10px;border-radius:50%;background:var(--cyan);margin-top:6px;flex:none}.tli.past{opacity:.55}.tli.past .dot{background:var(--mut)}.tli.soon .dot{background:var(--gold)}.tli b{font-size:12.5px;white-space:nowrap}.tli.soon b{color:var(--gold)}
.kp.cl{cursor:pointer}.kp.cl:hover,.kp.cl:focus-visible{border-color:var(--brand);outline:none}.stg{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(120px,1fr))}.stg .kp .k{font-size:26px}.stg .kp.on{background:color-mix(in srgb,var(--brand) 10%,var(--card))}.stgsel{padding:4px 6px;font-size:13px}.steps{padding-left:20px;margin:6px 0 0}.steps li{margin:6px 0}.mono{font:600 13px ui-monospace,monospace}.btn.sm{padding:5px 12px;font-size:12px}.empty{text-align:center;padding:28px 16px}.empty p{max-width:560px;margin:8px auto 16px}
tbody tr:last-child td{border-bottom:0}
#cin{width:100%;min-height:110px;font:12px ui-monospace,monospace}
</style></head><body>

const GT=["I would not mind routine unchallenging work if the pay and pension prospects were good.","I like to test boundaries and get into areas where few have worked before.","I tend not to like to stand out or be unconventional.","Capable people who fail to become successful have not usually taken chances when they have occurred.","I rarely day dream.","I find it difficult to switch off from work completely.","You are either naturally good at something or you are not, effort makes no difference.","Sometimes people find my ideas unusual.","I would rather buy a lottery ticket than enter a competition.","I like challenges that stretch my abilities and get bored with things I can do quite easily.","I would prefer to have a moderate income in a secure job rather than a high income in a job that depended on my performance.","At work, I often take over projects and steer them my way without worrying about what other people think.","Many of the bad times that people experience are due to bad luck.","Sometimes I think about information almost obsessively until I come up with new ideas and solutions.","If I am having problems with a task I leave it, forget it and move on to something else.","When I make plans I nearly always achieve them.","I do not like unexpected changes to my weekly routines.","If I wanted to achieve something and the chances of success were 50/50 I would take the risk.","I think more of the present and past than of the future.","If I had a good idea for making some money, I would be willing to invest my time and borrow money to enable me to do it.","I like a lot of guidance to be really clear about what to do in work.","People generally get what they deserve.","I am wary of new ideas, gadgets and technologies.","It is more important to do a job well than to try to please people.","I try to accept that things happen to me in life for a reason.","Other people think that I'm always making changes and trying out new ideas.","If there is a chance of failure I would rather not do it.","I get annoyed if people are not on time for meetings.","Before I make a decision I like to have all the facts no matter how long it takes.","I rarely need or want any assistance and like to put my own stamp on work that I do.","You are not likely to be successful unless you are in the right place at the right time.","I prefer to be quite good at several things rather than very good at one thing.","I would rather work with a person I liked who was not good at the job, rather than work with someone I did not like even if they were good at the job.","Being successful is a result of working hard, luck has little to do with it.","I prefer doing things in the usual way rather than trying out new methods.","Before making an important decision I prefer to weigh up the pro's and con's fairly quickly rather than spending a long time thinking about it.","I would rather work on a task as part of a team rather than take responsibility for it myself.","I would rather take an opportunity that might lead to even better things than have an experience that I am sure to enjoy.","I usually do what is expected of me and follow instructions carefully.","For me, getting what I want is a just reward for my efforts.","I like to have my life organised so that it runs smoothly and to plan.","When I am faced with a challenge I think more about the results of succeeding than the effects of failing.","I believe that destiny determines what happens to me in life.","I like to spend time with people who have different ways of thinking.","I find it difficult to ask for favours from other people.","I get up early, stay late or skip meals if I have a deadline for some work that needs to be done.","What we are used to is usually better than what is unfamiliar.","I get annoyed if superiors or colleagues take credit for my work.","People's failures are rarely the result of their poor judgement.","Sometimes I have so many ideas that I feel pressurised.","I find it easy to relax on holiday and forget about work.","I get what I want from life because I work hard to make it happen.","It is harder for me to adapt to change than keep to a routine.","I like to start interesting projects even if there is no guaranteed payback for the money or time I have to put in."];

// ---------- Applications ----------

function apps(){if(S.cur&&A(S.cur))return profile(A(S.cur));
const q=(S.q||'').toLowerCase(),L=S.apps.filter(a=>(!S.fa||a.ar===S.fa)&&(!S.fe||(S.fe==='y'?isEl(a):!isEl(a)))&&(!S.fs||stageOf(a)===S.fs)&&(!S.fy||fy(a))&&(!q||(a.n+' '+a.o+' '+a.id).toLowerCase().includes(q))).sort((x,y)=>ascore(y).t-ascore(x).t);SHOWN=L;

${CODE?codePanel():''}${EXP?expPanel(L):''}<p class="msg">${e(CM)}</p>
<div class="card wrap"><p class="hint" style="margin:0 0 8px">${L.length} of ${S.apps.length} shown, highest score first${nS?` · ${nS} ticked for export · <a href="#" onclick="S.sel=[];save();render();return false">clear ticks</a>`:''}. Select a business to see its full profile.</p><table><thead><tr><th><input type="checkbox" title="Tick everyone shown" aria-label="Tick everyone shown" ${L.length&&L.every(a=>isSel(a.id))?'checked':''} onchange="tickAll(this.checked)"></th><th>Business</th><th>Trade</th><th>Area</th><th>Owner</th><th>Requirements</th><th style="min-width:150px">Score</th><th>Stage</th><th>Support needs</th><th>Applied</th></tr></thead><tbody>${L.map(a=>{const m=EL.filter(([k])=>!(a.el||{})[k]).length,d=anum(a),nn=ares(a).filter(r=>r.need).length;return `<tr class="c" onclick="openP('${a.id}')"><td onclick="event.stopPropagation()"><input type="checkbox" aria-label="Tick ${e(a.n)}" ${isSel(a.id)?'checked':''} onchange="tick('${a.id}',this.checked)"></td><td><b>${e(a.n)||'(unnamed)'}</b><div class="hint">${e(a.o)}</div></td><td>${e(a.tr)}</td><td>${e(a.ar)}</td><td>${fy(a)?chip('Young woman','tl'):`<span class="hint">${ownLab(a)}</span>`}</td><td>${m?chip('Missing '+m,'amb'):chip('All met','grn')}</td><td>${sbar(ascore(a).t)}</td><td onclick="event.stopPropagation()">${stSel(a)}</td><td>${d<ACC.length?`<span class="hint">${d} of 7 answered</span>`:nn?nn+' of 7':'None'}</td><td class="hint">${e(appliedOn(a))}</td></tr>`}).join('')||`<tr><td colspan=10 class="hint">${S.apps.length?'No businesses match these filters.':'No applications yet. Paste a code from an applicant’s email or WhatsApp to get started, or add sample businesses under How we score to try things out.'}</td></tr>`}</tbody></table></div>`}

// ---------- Business profile (read only) ----------
function profile(a){const x=ascore(a),E=eres(a),R=ares(a),F=a.form||{},miss=EL.filter(([k])=>!(a.el||{})[k]),pr=R.filter(r=>r.need),back=S.back&&S.back!=='apps'?S.back:'apps',bl={dash:'Overview',diag:'Diagnostic profiles',crit:'How we score',apps:'Applications'}[back];

return `<div class="tb"><button class="btn s" onclick="S.cur=null;go('${back}')">← Back to ${bl}</button><label class="hint" style="display:flex;align-items:center;gap:6px">Stage ${stSel(a,'')}</label><span style="flex:1"></span><button class="btn s" onclick="doExp('pdf',[A('${a.id}')])">⇩ Profile as PDF</button><button class="btn s" onclick="doExp('xlsx',[A('${a.id}')])">⇩ Profile as Excel</button></div>
<div class="card ph"><div style="flex:1;min-width:220px"><small>Business profile</small><h2>${e(a.n)||'(unnamed business)'}</h2><p style="margin:2px 0 10px">${[a.o,a.tr,a.ar].filter(Boolean).map(e).join(' · ')}</p><div class="chips">${miss.length?chip('Missing '+miss.length+' of 7 requirements','amb'):chip('Meets all seven requirements','grn')}${fy(a)?chip('Owned by a young woman','tl'):chip(ownLab(a),'')}${E.ga?chip('GET2 '+gl(E.gs).toLowerCase(),''):''}${pr.length?chip(pr.length+' support '+(pr.length===1?'need':'needs'),''):''}</div></div>${ring(x.t,SMAX)}</div>
<p class="ro">View only. Everything on this page comes from the applicant’s own answers on the application form and cannot be changed in the hub.</p>
<div class="jump">${[['p-score','Score'],['p-about','About the business'],['p-needs','What they need'],['p-ent','Entrepreneurial profile'],['p-irl','Innovation readiness'],['p-ans','Their answers']].map(([i,t])=>`<a href="#" onclick="jump('${i}');return false">${t}</a>`).join('')}</div>
${sec('p-score','Score and requirements')}<div class="g2"><div class="card"><h3>How the score adds up</h3>${hbars([['Verification checks',x.v,6],['Enterprising tendency (GET2)',x.get,54],['Grit',x.grit,60],['Innovation readiness (IRL)',x.irl,54],['Documented growth plans',x.gp,GP]],{fmt:(v,m)=>v+' / '+m})}<h3 style="margin-top:16px">Verification checks <span class="hint">1 point each</span></h3>${VC.map(([k,n])=>`<div class="ck ${(a.vf||{})[k]?'y':'n'}">${(a.vf||{})[k]?'✓':'✗'} ${n}</div>`).join('')}</div><div class="card"><h3>Minimum requirements</h3>${EL.map(([k,n])=>`<div class="ck ${(a.el||{})[k]?'y':'n'}">${(a.el||{})[k]?'✓':'✗'} ${n}</div>`).join('')}<p class="hint" style="margin-bottom:0">From the quick check at the start of the form. All seven must be met before a business is ranked.</p></div></div>
${sec('p-about','About the business')}<div class="card"><div class="kv">${kv('Reference',/^fIRM-/.test(a.id)?a.id.slice(1):'')}${kv('Stage',stageOf(a))}${kv('Owner',a.o)}${kv('Owner gender',{F:'Female',M:'Male'}[a.g]||'Not stated')}${kv('Youth-owned (35 or under)',a.yo?'Yes':'No')}${kv('Area',a.ar)}${kv('Main trade',a.tr)}${kv('Applied on',appliedOn(a))}${kv('Years trading',yt===''?'':yt)}${kv('Employees',F.O9)}${kv('Youth employees',F.O11)}${kv('Employees band',F.B21)}${kv('Annual turnover band',F.B20)}${kv('Revenue band, last financial year',F.O5)}${kv('Email',a.em)}${kv('Phone',a.ph)}</div></div>
${sec('p-needs','What they need','From the MSME acceleration diagnostic. Areas marked “Support needed” become priorities in the Enterprise Development Plan.')}<div class="card"><p style="margin-top:0"><b>Priorities for their Enterprise Development Plan:</b> ${anum(a)<ACC.length?'<span class="hint">the diagnostic is not complete yet.</span>':pr.length?pr.map(r=>e(r.c.n)).join(' · '):'nothing urgent; all seven areas are in place.'}</p><div class="ncg">${R.map(r=>{const[t,c]=status(r);return `<div class="nc ${c}"><div class="nch"><b>${r.c.n}</b>${chip(t,c)}</div><div class="hint">${e(r.c.q)}</div><div class="nca">Answer: <b>${e(r.x||'–')}</b></div>${r.gaps.length?`<ul>${r.gaps.map(g=>`<li>${e(g)}</li>`).join('')}</ul>`:''}</div>`}).join('')}</div></div>
${sec('p-ent','Entrepreneurial profile')}<div class="g2"><div class="card"><h3>Enterprising tendency (GET2)</h3>${E.ga?`<div class="big">${E.gs}<span> / 54 · ${gl(E.gs)}</span></div>${hbars(E.d.map(y=>[GD.find(g=>g[1]===y.n)[0],y.s,y.t]),{fmt:(v,m)=>v+' / '+m})}<p class="hint" style="margin-bottom:0">High 44–54 · Medium 27–43 · Low 0–26. ${E.ga<54?E.ga+' of 54 statements answered.':''}</p>`:'<p class="hint">Not answered.</p>'}</div><div class="card"><h3>Grit</h3>${E.gn?`<div class="big">${E.gp}<span> / 60 · average ${fmt1(E.gr)} of 5 · ${gtl(E.gr).toLowerCase()}</span></div>${hbars([['Perseverance of effort',E.sub[0],5],['Consistency of interest',E.sub[1],5]],{fmt:(v,m)=>fmt1(v)+' / '+m})}<p class="hint" style="margin-bottom:0">Statements 2, 3, 5, 7, 8 and 11 are scored in reverse.</p>`:'<p class="hint">Not answered.</p>'}</div></div>

// ---------- Diagnostic profiles ----------
function diag(){const q=(S.dqq||'').toLowerCase(),srt=S.ds||'score';
const L=S.apps.filter(a=>!q||(a.n+' '+a.o+' '+a.tr+' '+a.ar).toLowerCase().includes(q)).sort((x,y)=>srt==='name'?String(x.n).localeCompare(y.n):srt==='needs'?ares(y).filter(r=>r.need).length-ares(x).filter(r=>r.need).length:ascore(y).t-ascore(x).t);
return `<div class="card hello"><div><h2>Diagnostic profiles</h2><p style="margin:0">One card per business, showing its score, readiness shape and the support it needs. Select a card for the full profile.</p></div></div>
<div class="tb"><input placeholder="Search business, owner, trade or area" value="${e(S.dqq)}" onchange="S.dqq=this.value;render()" aria-label="Search" style="flex:1;min-width:200px"><select onchange="S.ds=this.value;save();render()" aria-label="Sort"><option value="score" ${srt==='score'?'selected':''}>Highest score first</option><option value="needs" ${srt==='needs'?'selected':''}>Most support needs first</option><option value="name" ${srt==='name'?'selected':''}>A to Z</option></select></div>
${L.length?`<div class="gal">${L.map(a=>{const x=ascore(a),R=ares(a),pr=R.filter(r=>r.need),E=eres(a);return `<button class="gc" onclick="openP('${a.id}')"><div class="gch"><div><b>${e(a.n)||'(unnamed)'}</b><div class="hint">${[a.o,a.tr,a.ar].filter(Boolean).map(e).join(' · ')}</div></div><div class="gs">${x.t}<span>/${SMAX}</span></div></div><div class="bar"><i style="width:${pct(x.t,SMAX)}%"></i></div><div class="gcb"><div style="width:120px;flex:none">${spider([{v:IRL.map(([k])=>(a.il||{})[k]||0),c:'var(--brand)',l:a.n}],{w:120}).replace(/<text[^>]*>[^<]*(<tspan[^>]*>[^<]*<\/tspan>)?<\/text>/g,'')}</div><div style="flex:1;min-width:0"><div class="hint">Support needed</div>${anum(a)<ACC.length?'<div class="hint">Diagnostic not complete</div>':pr.length?`<div class="chips">${pr.map(r=>chip(r.c.n,'amb')).join('')}</div>`:chip('None','grn')}<div class="hint" style="margin-top:8px">${E.ga?'GET2 '+E.gs+'/54 · ':''}${E.gn?'Grit '+fmt1(E.gr)+'/5':''}</div></div></div><span class="gcl">Open profile →</span></button>`}).join('')}</div>`:`<div class="card empty"><p>${S.apps.length?'No businesses match your search.':'No applications yet.'}</p></div>`}`}

// ---------- How we score ----------
function crit(){return `<div class="card hello"><div><h2>How we score</h2><p style="margin:0">How applications are scored, ranked and selected. The hub is view only: scores come straight from the applicants’ answers.</p></div></div>
<div class="g2"><div class="card"><h3>The application score, out of ${SMAX}</h3><table><thead><tr><th>Part</th><th>Where it comes from</th><th>Points</th></tr></thead><tbody>${[['Verification checks','1 point each for six checks, worked out from the form (listed below)','6'],['Enterprising tendency (GET2)','1 point for agreeing with an even-numbered statement or disagreeing with an odd-numbered one','54'],['Grit','1 to 5 points per statement; six statements are scored in reverse','60'],['Innovation readiness (IRL)','The level (1 to 9) chosen for each of six areas','54'],['Documented growth plans','Finance-ready, with documented growth plans. Carries the most weight, so it is the key distinguisher when ranking',''+GP+'']].map(r=>`<tr><td><b>${r[0]}</b></td><td style="white-space:normal">${r[1]}</td><td>${r[2]}</td></tr>`).join('')}<tr><td><b>Total</b></td><td></td><td><b>${SMAX}</b></td></tr></tbody></table></div>

function needs(list){return ACC.map((c,i)=>{const R=list.map(a=>ares(a)[i]).filter(r=>r.need!==null),n=R.filter(r=>r.need).length,g={};R.forEach(r=>r.gaps.forEach(x=>g[x]=(g[x]||0)+1));return[c.n,R.length,n,R.length?Math.round(n/R.length*100)+'%':'',Object.entries(g).sort((x,y)=>y[1]-x[1]).map(([k,v])=>k+' ('+v+')').join('; ')]})}
async function doExp(fmt,only){const one=!!only,list=only||xlist(),G=one?XG.map(x=>x[0]):xgs();
const say=m=>{XM=m;if(one||!EXP){if(!/ saved with \d/.test(m))alert(m)}else render()};
if(!list.length)return say((S.xw||'sel')==='sel'?'Tick at least one business in the list first, or choose “Shown in the list” or “Everyone”.':'There are no businesses to export.');
if(!G.length)return say('Choose at least one kind of information to include.');
const T=xtable(list,G);
try{
if(fmt==='csv'){const q=v=>{v=String(v??'');return/[",\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};if(await dlFile(new Blob(['﻿'+[T.head,...T.rows].map(r=>r.map(q).join(',')).join('\r\n')],{type:'text/csv;charset=utf-8'}),fname(list,'csv'))===false)return;return say('CSV saved with '+list.length+' '+(list.length===1?'business':'businesses')+'.')}
if(fmt==='json'){if(await dlFile(new Blob([JSON.stringify({type:'irm-newcastle-hub',version:1,exported:new Date().toISOString(),dl:DLs(),columns:T.head,apps:list.map(a=>Object.assign({},a,{st:stageOf(a)}))},null,1)],{type:'application/json'}),fname(list,'json'))===false)return;return say('JSON data port saved with '+list.length+' '+(list.length===1?'record':'records')+'.')}
if(fmt==='xlsx')return await toXlsx(list,G,T,say);
if(fmt==='pdf')return await toPdf(list,G,T,say,one);
}catch(err){say('Something went wrong while exporting. Please try again.')}}
async function toXlsx(list,G,T,say){
try{await loadJs(LIB.xlsx)}catch(_){
const h='<html><head><meta charset="utf-8"></head><body><table border="1"><tr>'+T.head.map(x=>'<th>'+e(x)+'</th>').join('')+'</tr>'+T.rows.map(r=>'<tr>'+r.map(x=>'<td>'+e(x)+'</td>').join('')+'</tr>').join('')+'</table></body></html>';
if(await dlFile(new Blob([h],{type:'application/vnd.ms-excel'}),fname(list,'xls'))===false)return;return say('The Excel tool could not load (are you offline?), so this was saved as an .xls file that Excel can still open.')}
const X=window.XLSX,wb=X.utils.book_new(),ws=X.utils.aoa_to_sheet([T.head,...T.rows.map(r=>r.map(num))]);
ws['!cols']=T.head.map((h,i)=>({wch:Math.min(50,Math.max(10,h.length,...T.rows.map(r=>String(r[i]).length)))}));ws['!autofilter']={ref:X.utils.encode_range({s:{r:0,c:0},e:{r:T.rows.length,c:T.head.length-1}})};ws['!freeze']={xSplit:1,ySplit:1};
X.utils.book_append_sheet(wb,ws,'Applications');
X.utils.book_append_sheet(wb,X.utils.aoa_to_sheet([['Component','Businesses answered','Need support','Share','Most common needs'],...needs(list)]),'Support needs');
const sc=list.map(ascore);X.utils.book_append_sheet(wb,X.utils.aoa_to_sheet([['Newcastle IRM Enterprise Development Programme'],['Exported',new Date().toLocaleString()],['Businesses',list.length],['Meet all seven requirements',list.filter(isEl).length],['Owned by young women',list.filter(fy).length],['Average application score (of '+SMAX+')',list.length?Math.round(sc.reduce((t,x)=>t+x.t,0)/list.length):''],[],['Application score = 6 verification checks + GET2 (up to 54) + grit (up to 60) + IRL (up to 54) + '+GP+' for documented growth plans.'],[],['Key dates'],...DLs().map(([d,t])=>[d,t])]),'About');
if(await dlFile(new Blob([X.write(wb,{bookType:'xlsx',type:'array'})],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}),fname(list,'xlsx'))===false)return;say('Excel file saved with '+list.length+' '+(list.length===1?'business':'businesses')+'.')}
async function toPdf(list,G,T,say,one){
try{await loadJs(LIB.pdf);await loadJs(LIB.pdfT)}catch(_){return printPdf(list,G,T,say)}
const {jsPDF}=window.jspdf,doc=new jsPDF({orientation:one?'portrait':'landscape',unit:'pt',format:'a4'}),brand=[0,94,106],per=one||S.xp!==false;
const head=(t,sub)=>{doc.setFont('helvetica','bold');doc.setFontSize(15);doc.setTextColor(27,34,39);doc.text(t,40,44);doc.setFont('helvetica','normal');doc.setFontSize(9);doc.setTextColor(92,107,112);doc.text(sub,40,60)};
const foot=()=>{const n=doc.getNumberOfPages();for(let i=1;i<=n;i++){doc.setPage(i);const w=doc.internal.pageSize.getWidth(),h=doc.internal.pageSize.getHeight();doc.setFontSize(8);doc.setTextColor(120);doc.text('NBI · Newcastle IRM Selection & Diagnostic Hub · exported '+today(),40,h-20);doc.text('Page '+i+' of '+n,w-40,h-20,{align:'right'})}};
const clean=v=>String(v??'').replace(/[“”]/g,'"').replace(/[‘’]/g,"'").replace(/[→]/g,'->');
if(!one){
// Summary page: keep it readable by limiting columns; full detail goes on the per-business pages.
const key=['Business','Owner','Main trade','Area','Stage','Young woman owner','Meets all seven','Total score (of '+SMAX+')','EDP priorities'],big=T.head.length>12,idx=big?T.head.map((h,i)=>key.includes(h)?i:-1).filter(i=>i>=0):T.head.map((_,i)=>i);
const ix=idx.length?idx:[0];
head('Newcastle IRM applications',list.length+' '+(list.length===1?'business':'businesses')+' · '+new Date().toLocaleDateString()+(big&&!per?' · showing key columns; tick "add a page for each business" for full detail':big?' · key columns here, full detail on the pages that follow':''));
doc.autoTable({startY:72,head:[ix.map(i=>clean(T.head[i]))],body:T.rows.map(r=>ix.map(i=>clean(r[i]))),styles:{fontSize:ix.length>10?7:8,cellPadding:4,overflow:'linebreak'},headStyles:{fillColor:brand,textColor:255},alternateRowStyles:{fillColor:[243,247,246]},margin:{left:40,right:40,bottom:36}});
const nd=needs(list).filter(r=>r[1]);if(nd.length&&G.includes('diag')){doc.addPage();head('Where these businesses need support','Share of businesses with an answer for each component');doc.autoTable({startY:72,head:[['Component','Answered','Need support','Share','Most common needs']],body:nd.map(r=>r.map(clean)),styles:{fontSize:8,cellPadding:4},headStyles:{fillColor:brand},margin:{left:40,right:40,bottom:36}})}}
if(per){list.forEach((a,k)=>{if(!one||k)doc.addPage('a4','portrait');const C=xcols(G),x=ascore(a);
head(clean(a.n||'(unnamed business)'),[a.o,a.tr,a.ar,stageOf(a)].filter(Boolean).map(clean).join(' · ')+' · score '+x.t+' of 194');
let y=72;G.forEach(g=>{const rows=(COL[g]||[]).map(([l,f])=>[clean(l),clean(f(a))]);if(!rows.length)return;
doc.autoTable({startY:y,head:[[XG.find(q=>q[0]===g)[1],'']],body:rows,theme:'grid',styles:{fontSize:8,cellPadding:3,overflow:'linebreak'},headStyles:{fillColor:brand,textColor:255},columnStyles:{0:{cellWidth:200,fontStyle:'bold'}},margin:{left:40,right:40,bottom:36}});y=doc.lastAutoTable.finalY+12})})}
foot();if(await dlFile(doc.output('blob'),fname(list,'pdf'))===false)return;say('PDF saved with '+list.length+' '+(list.length===1?'business':'businesses')+'.')}
function printPdf(list,G,T,say){const h=`<!doctype html><html><head><meta charset="utf-8"><title>Newcastle IRM applications</title><style>body{font:11px Poppins,Arial,sans-serif;margin:24px}table{border-collapse:collapse;width:100%}th,td{border:1px solid #ccc;padding:4px;text-align:left;vertical-align:top}th{background:#005e6a;color:#fff}@page{size:landscape}</style></head><body><h2>Newcastle IRM applications (${list.length})</h2><table><tr>${T.head.map(x=>'<th>'+e(x)+'</th>').join('')}</tr>${T.rows.map(r=>'<tr>'+r.map(x=>'<td>'+e(x)+'</td>').join('')+'</tr>').join('')}</table><script>onload=()=>print()<\/script></body></html>`;
const w=window.open('','_blank');if(w){w.document.write(h);w.document.close();say('The PDF tool could not load (are you offline?). A print view has opened instead: choose “Save as PDF” as the printer.')}else{dlFile(new Blob([h],{type:'text/html'}),fname(list,'html')).then(ok=>{if(ok)say('The PDF tool could not load. A printable page was saved instead: open it and print to PDF.')})}}

// ---------- Sign-in (used when the hub is opened as a plain page; on the NBI website the server access keys apply instead) ----------
const USERS=[["Majuba admin 1", "41c0bef504bf99ddbe570376ff45eac277d1f08489dc7eeb9ef6e3855cbe36b5"], ["Majuba admin 2", "020a848df6bf1429815d9b25c026e15805bf1972f0b35c75579b5aa1aea32e26"], ["Majuba admin 3", "defef26f067dfeabc3d65bfa877668f597c0c2ec7eda96dbfff5058670b08974"], ["NBI admin 1", "43b8f1fbad7f4076b1582d61ba912161fa1f3cc5937439a8650af9a9e9450a41"], ["NBI admin 2", "e5335f3e71dd03518629a0415d5accb39579b01f7104b8c8414ba81ac0fbd405"], ["NBI admin 3", "438010a296603d021c025a70cef1a3781234ae9fb0bd55c08b5e29499eba8b74"]];
let AUTH=null,GM='';try{AUTH=sessionStorage.getItem('irm-user')}catch(_){}
if(!USERS.some(x=>x[0]===AUTH))AUTH=null;
async function sha(p){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('irm-nc|'+p));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
async function gateIn(ev){ev.preventDefault();const p=$('#gp').value.trim();GM='';try{const h=await sha(p),u=USERS.find(x=>x[1]===h);if(u){AUTH=u[0];try{sessionStorage.setItem('irm-user',AUTH)}catch(_){}}else GM='That password was not accepted. Please check it and try again.'}catch(_){GM='This browser cannot check passwords on this page. Open the hub over https.'}render()}
function gateOut(){AUTH=null;GM='';try{sessionStorage.removeItem('irm-user')}catch(_){}render()}
function gate(){return `<div class="card" style="max-width:520px;margin:28px auto"><h2>Sign in to the hub</h2><p>This hub shows applicants’ personal information. Enter the password the NBI programme team gave you.</p><form onsubmit="gateIn(event)"><div style="display:flex;flex-direction:column;gap:4px;margin:12px 0"><span class="hint">Password</span><input id="gp" type="password" autocomplete="current-password" required aria-label="Password"></div>${GM?`<p class="bad">${e(GM)}</p>`:''}<button class="btn" type="submit">Sign in</button></form><p class="hint" style="margin-bottom:0">Only sign in on a device you trust, and sign out when you are finished on a shared computer.</p></div>`}

// ---------- Website mode: applications stored on the site, shared with everyone who has an access key ----------
var ON={site:/^https?:$/.test(location.protocol)&&!/(^|\.)(claude\.ai|claudeusercontent\.com|claude\.site)$/.test(location.hostname),checking:false,live:false,need:false,busy:false,msg:'',off:'',role:null,at:null};
const KEYN='irm-hub-key';
const getKey=()=>{try{return sessionStorage.getItem(KEYN)||localStorage.getItem(KEYN)||''}catch(_){return''}};
function clearKey(){try{sessionStorage.removeItem(KEYN);localStorage.removeItem(KEYN)}catch(_){}}
function setKey(k,remember){clearKey();try{(remember?localStorage:sessionStorage).setItem(KEYN,k)}catch(_){}}
async function sync(quiet){if(!ON.site)return;const k=getKey();ON.busy=true;if(!quiet&&ON.live)render();
try{const r=await fetch('/api/applications',{headers:k?{'x-hub-key':k}:{},cache:'no-store'});
if(r.status===404||r.status===405){ON.site=false;ON.checking=false;ON.busy=false;return render()}
const j=await r.json().catch(()=>({}));ON.checking=false;
if(r.status===401){if(k)ON.msg='That access key was not accepted. Please check it and try again.';clearKey();ON.live=false;ON.need=true;S.apps=[];S.cur=null}
else if(!r.ok){ON.off=j.error||'The website could not load applications right now.';ON.need=false}
else{S.apps=(Array.isArray(j.apps)?j.apps:[]).map(o=>{try{return o&&o.i?rec(o):null}catch(_){return null}}).filter(Boolean);
if(Array.isArray(j.dates)&&j.dates.length)S.dl=j.dates;cleanAll();S.apps.forEach(normAc);
if(S.cur&&!S.apps.some(a=>a.id===S.cur))S.cur=null;ON.live=true;ON.need=false;ON.msg='';ON.off='';ON.role=j.role;ON.at=new Date();save()}}
catch(_){ON.checking=false;ON.off='Could not reach the website. Check your internet connection.'}
ON.busy=false;render()}
function signin(){return `<div class="card" style="max-width:520px;margin:28px auto"><h2>Sign in to the hub</h2><p>This hub shows applicants’ personal information, so you need an access key. Ask the NBI programme team if you do not have one.</p><form onsubmit="doSign(event)"><div style="display:flex;flex-direction:column;gap:4px;margin:12px 0"><span class="hint">Access key</span><input id="hk" type="password" autocomplete="current-password" required aria-label="Access key"></div><div style="display:flex;gap:8px;align-items:center;margin:8px 0 14px;font-size:13.5px"><input id="hr" type="checkbox"><label for="hr">Remember me on this device</label></div>${ON.msg?`<p class="bad">${e(ON.msg)}</p>`:''}<button class="btn" type="submit">${ON.busy?'Checking…':'Sign in'}</button></form><p class="hint" style="margin-bottom:0">Only sign in on a device you trust. Use “Sign out” when you are finished on a shared computer.</p></div>`}
function doSign(ev){ev.preventDefault();const k=$('#hk').value.trim();if(!k)return;setKey(k,$('#hr').checked);ON.msg='';ON.busy=true;render();sync()}
function signOut(){clearKey();ON.live=false;ON.need=true;S.apps=[];S.cur=null;S.sel=[];save();go('dash',null)}
function liveBar(){if(!ON.live)return AUTH?`<div style="text-align:right;flex:none"><span class="chip">View only</span><div class="hint" style="margin-top:6px">Signed in as ${e(AUTH)} · <a href="#" onclick="gateOut();return false">Sign out</a></div></div>`:'<span class="chip">View only</span>';const t=ON.at?ON.at.toLocaleTimeString('en-ZA',{hour:'2-digit',minute:'2-digit'}):'';
return `<div style="text-align:right;flex:none"><span class="chip">${ON.role==='admin'?'Programme team':'View only'}</span><div class="hint" style="margin-top:6px;white-space:nowrap">Live · updated ${t} · <a href="#" onclick="sync();return false">Refresh</a> · <a href="#" onclick="signOut();return false">Sign out</a></div></div>`}
async function pushPayloads(L,bad,hubFiles){let n=0,d=0,b=bad||0;
for(const o of L){try{const r=await fetch('/api/applications',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(o)});if(r.status===201)n++;else if(r.ok)d++;else b++}catch(_){b++}}
CM=(n?'Added '+n+' to the website.':'Nothing new was added.')+(d?' '+d+' already on the website.':'')+(b?' '+b+' could not be read or saved.':'')+(hubFiles?' Hub export files cannot be added to the website; use the original application files or codes.':'');
if(n||d)await sync(true);else render()}
async function putDates(v){try{const r=await fetch('/api/dates',{method:'PUT',headers:{'Content-Type':'application/json','x-hub-key':getKey()},body:JSON.stringify({dates:v})}),j=await r.json().catch(()=>({}));
if(!r.ok){DLM=j.error||'The dates could not be saved.';return render()}S.dl=j.dates;DLE=false;DLM='';render()}catch(_){DLM='Could not reach the website to save the dates.';render()}}
if(ON.site){ON.checking=true;sync()}
setInterval(()=>{const a=document.activeElement;if(ON.live&&!ON.busy&&document.visibilityState==='visible'&&!DLE&&!CODE&&!EXP&&!(a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)))sync(true)},60000);

render();
</script></body></html>
